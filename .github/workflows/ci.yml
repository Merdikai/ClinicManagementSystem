name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: .NET 10 Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_password_123!
          POSTGRES_DB: ClinicManagementDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ClinicManagementSystem.slnx

      - name: Build solution
        run: dotnet build ClinicManagementSystem.slnx -c Release --no-restore

      - name: Run Unit Tests with Coverage
        run: >
          dotnet test tests/ClinicManagementSystem.UnitTests/ClinicManagementSystem.UnitTests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit_tests.trx"

      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ClinicManagementDb;Username=clinic_user;Password=clinic_password_123!"
        run: >
          dotnet test tests/ClinicManagementSystem.IntegrationTests/ClinicManagementSystem.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration_tests.trx"

  frontend-ci:
    name: Angular 22 Frontend Build & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: clinic-client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular application
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

  e2e-wcag-ci:
    name: Playwright E2E & WCAG 2.1 AA Audits
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: clinic-client

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_password_123!
          POSTGRES_DB: ClinicManagementDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: clinic-client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Backend in Background
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ClinicManagementDb;Username=clinic_user;Password=clinic_password_123!"
          ASPNETCORE_URLS: "http://localhost:5041"
          ASPNETCORE_ENVIRONMENT: "Development"
        run: |
          dotnet run --project ../src/ClinicManagementSystem.API/ClinicManagementSystem.API.csproj &
          sleep 10

      - name: Start Frontend in Background
        run: |
          npm start &
          sleep 15

      - name: Run Playwright E2E & Accessibility Tests
        run: npm run e2e

