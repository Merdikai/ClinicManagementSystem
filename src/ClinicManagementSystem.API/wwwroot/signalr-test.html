<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic SignalR Live Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; max-width: 700px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; color: #38bdf8; font-size: 22px; }
        #status { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        .connected { background: #064e3b; color: #34d399; }
        .disconnected { background: #450a0a; color: #f87171; }
        #events { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        #events li { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px 16px; margin-bottom: 8px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🩺 Clinic Management System - Real-Time Hub Monitor</h1>
        <div>Connection Status: <span id="status" class="disconnected">Connecting...</span></div>
        <h3>Live Event Feed:</h3>
        <ul id="events"></ul>
    </div>

    <script>
        const statusElem = document.getElementById('status');
        const eventsList = document.getElementById('events');

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hubs/clinic")
            .withAutomaticReconnect()
            .build();

        function addEvent(title, msg) {
            const li = document.createElement('li');
            li.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ' [' + title + ']:</strong> ' + JSON.stringify(msg);
            eventsList.prepend(li);
        }

        connection.on("AppointmentBooked", data => addEvent("AppointmentBooked", data));
        connection.on("PatientCheckedIn", data => addEvent("PatientCheckedIn", data));
        connection.on("LowStockAlert", data => addEvent("LowStockAlert", data));
        connection.on("InvoicePaid", data => addEvent("InvoicePaid", data));

        connection.start().then(() => {
            statusElem.textContent = "Connected to SignalR";
            statusElem.className = "connected";
        }).catch(err => {
            statusElem.textContent = "Disconnected";
            statusElem.className = "disconnected";
            console.error(err);
        });
    </script>
</body>
</html>
